decontx_matrix_url: null
scar_matrix_url: null

# simulation parameters
# PBMC-like: realistic, highly imbalanced composition with rare populations.
# Tests whether markers from abundant types (which dominate the ambient pool)
# are removed from rare types without erasing the rare types' own markers.
# Core scale
G: 10000
N: 100000
k: 10

# Cell composition
empty_prob: 0.95              # ~5,000 cells, typical of a 10x v3 PBMC 5k run
expected_cell_size: 5000      # 10x v3 PBMC median UMIs/cell ~4-7k
type_proportions:             # loosely modeled on PBMC composition
  - 0.37   # CD4 T
  - 0.20   # CD14 monocytes
  - 0.15   # CD8 T
  - 0.10   # B
  - 0.08   # NK
  - 0.05   # FCGR3A monocytes
  - 0.02   # cDC
  - 0.02   # platelets
  - 0.005  # pDC (rare)
  - 0.005  # HSPC (rare)

# Ambient RNA
alpha: 0.05                   # ~5% ambient, typical for fresh PBMCs
noise_logsd_empty: 1.0
noise_logsd_cell: 0.5

# Expression structure
markers_per_type: 30
marker_boost: 15
housekeeping_frac: 0.08
hk_logmean: -0.5
hk_logsd: 1.0

# Count variability
dispersion: 2.0

# Barcode swapping
beta: 0.01                    # index hopping ~0.1-2% on patterned flow cells
